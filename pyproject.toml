[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loomground-installer"
version = "0.4.0"
description = "Verified runtime installation and host onboarding for Loomground"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt", "NOTICE"]
authors = [{name = "Loomground Contributors"}]
dependencies = ["cryptography>=46,<51", "packaging>=24,<27"]

[project.scripts]
loomground = "loomground_installer.cli:main"

[project.urls]
Homepage = "https://github.com/flxk1/loomground-plugins"
Repository = "https://github.com/flxk1/loomground-plugins"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# runtime-sources.json is a symlink to ../../runtime/runtime-sources.json
# (the single source of truth for the supported runtime Python range). This
# entry ships that same file as package data so `loomground_installer.requirements`
# can resolve it from an installed, non-editable wheel too, without a second
# hand-maintained literal copy.
loomground_installer = ["profiles.json", "runtime-sources.json"]
