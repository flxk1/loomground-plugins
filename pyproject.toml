[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loomground-installer"
version = "0.4.0"
description = "Verified runtime installation and host onboarding for Loomground"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt", "NOTICE"]
authors = [{name = "Loomground Contributors"}]
dependencies = ["cryptography>=46,<51", "packaging>=24,<27"]

[project.scripts]
loomground = "loomground_installer.cli:main"

[project.urls]
Homepage = "https://github.com/flxk1/loomground-plugins"
Repository = "https://github.com/flxk1/loomground-plugins"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loomground_installer = ["profiles.json"]
