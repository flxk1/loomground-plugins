name: CI

on:
  push:
  pull_request:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # supply_chain_gate.py uses tomllib (stdlib >= 3.11)
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install pytest==9.1.1   # release gate runs pytest; not in requirements-dev.txt
      - run: python -m pytest -q
      - run: python tools/release_gate.py
