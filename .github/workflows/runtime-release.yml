name: runtime-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact loomground-mcp version to release
        required: true
        default: "0.1.0"
      publish:
        description: Publish after all builds pass (false keeps a draft)
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: runtime-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Require the default branch and a strict version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Create an immutable-target draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="loomground-runtime-v${RELEASE_VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish >/tmp/release.json 2>/dev/null; then
            test "$(jq -r .isDraft /tmp/release.json)" = "true"
            test "$(jq -r .targetCommitish /tmp/release.json)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
              --title "Loomground runtime ${RELEASE_VERSION}" \
              --notes "Attested, offline Loomground runtime bundles. Verify both the ZIP and its public key with GitHub artifact attestations before installation."
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-14
          - macos-15-intel
          - windows-2025
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runtime/build-requirements.txt
      - name: Install the hash-locked build toolchain
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r runtime/build-requirements.txt
      - name: Build and sign with an ephemeral key
        id: bundle
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          platform="$(PYTHONPATH=src python -c 'from loomground_installer.runtime_bundle import runtime_platform; print(runtime_platform())')"
          stem="loomground-runtime-${RELEASE_VERSION}-${platform}-py312"
          key_json="$RUNNER_TEMP/${stem}-key.json"
          python tools/generate_ephemeral_release_key.py --directory "$RUNNER_TEMP" --stem "$stem" > "$key_json"
          private_key="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["private_key"])' "$key_json")"
          public_key="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["public_key"])' "$key_json")"
          key_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["key_id"])' "$key_json")"
          trap 'rm -f "$private_key" "$key_json"' EXIT
          output="$RUNNER_TEMP/$stem"
          python tools/assemble_runtime_release.py \
            --output "$output" \
            --signing-key "$private_key" \
            --public-key "$public_key" \
            --key-id "$key_id" \
            --expected-version "$RELEASE_VERSION"
          python -c 'import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); pathlib.Path(sys.argv[2]).write_text(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n")' \
            "$output.zip" "$output.sha256"
          {
            echo "archive=$output.zip"
            echo "checksum=$output.sha256"
            echo "public_key=$public_key"
            echo "sbom=$output/runtime-sbom.cdx.json"
          } >> "$GITHUB_OUTPUT"
      - name: Attest bundle, checksum and ephemeral public key
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            ${{ steps.bundle.outputs.archive }}
            ${{ steps.bundle.outputs.checksum }}
            ${{ steps.bundle.outputs.public_key }}
      - name: Attest the runtime SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ steps.bundle.outputs.archive }}
          sbom-path: ${{ steps.bundle.outputs.sbom }}
      - name: Upload attested assets to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          ARCHIVE: ${{ steps.bundle.outputs.archive }}
          CHECKSUM: ${{ steps.bundle.outputs.checksum }}
          PUBLIC_KEY: ${{ steps.bundle.outputs.public_key }}
        run: |
          gh release upload "loomground-runtime-v${RELEASE_VERSION}" \
            "$ARCHIVE" "$CHECKSUM" "$PUBLIC_KEY" \
            --repo "$GITHUB_REPOSITORY" --clobber

  installer:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runtime/build-requirements.txt
      - name: Build the installer wheel with the hash-locked toolchain
        id: installer
        shell: bash
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r runtime/build-requirements.txt
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP" .
          wheel="$(find "$RUNNER_TEMP" -maxdepth 1 -name 'loomground_installer-*.whl' -print -quit)"
          test -n "$wheel"
          echo "wheel=$wheel" >> "$GITHUB_OUTPUT"
      - name: Attest the installer wheel
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ steps.installer.outputs.wheel }}
      - name: Upload the attested installer wheel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          INSTALLER_WHEEL: ${{ steps.installer.outputs.wheel }}
        run: |
          gh release upload "loomground-runtime-v${RELEASE_VERSION}" "$INSTALLER_WHEEL" \
            --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    if: ${{ inputs.publish }}
    needs: [build, installer]
    runs-on: ubuntu-latest
    environment: runtime-release
    steps:
      - name: Publish only after every platform build and attestation succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release edit "loomground-runtime-v${RELEASE_VERSION}" \
            --repo "$GITHUB_REPOSITORY" --draft=false --latest
