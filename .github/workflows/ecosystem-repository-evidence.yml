name: ecosystem-repository-evidence

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  attestations: read

concurrency:
  group: ecosystem-repository-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Collect required native CI evidence at every pinned revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python tools/collect_github_evidence.py
          --self-commit "$GITHUB_SHA"
          --output "$RUNNER_TEMP/ecosystem-results"
          --exclude loomground-epistemic
          --exclude loomground-factual
          --exclude loomground-workspace
          --exclude oversight-certificate
      - name: Preserve complete and partial evidence for diagnosis
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecosystem-repository-github-${{ github.sha }}
          path: ${{ runner.temp }}/ecosystem-results
          if-no-files-found: error
          retention-days: 30

  native-backfill:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: loomground-epistemic
            commit: 2c1dc8ea8278fe3d1aeffa470319573c53dee932
            dependency: loomground-factual
            dependency_commit: db60a0592eb7741732944f05279b27def0c9685b
          - name: loomground-factual
            commit: db60a0592eb7741732944f05279b27def0c9685b
            dependency: ""
            dependency_commit: ""
          - name: loomground-workspace
            commit: b022d61f7c5e5d3dae85cf037f09ec4d446a3eb7
            dependency: ""
            dependency_commit: ""
          - name: oversight-certificate
            commit: 8dbb4fa46042f12eeecaf37cb1ad095b838d7185
            dependency: ""
            dependency_commit: ""
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the certifier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: control
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check out the exact repository revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: flxk1/${{ matrix.name }}
          ref: ${{ matrix.commit }}
          path: target
      - name: Check out the exact declared dependency
        if: ${{ matrix.dependency != '' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: flxk1/${{ matrix.dependency }}
          ref: ${{ matrix.dependency_commit }}
          path: dependency
      - name: Install only the certifier test toolchain
        run: >-
          python -m pip install
          -r control/requirements-dev.txt
          -r control/requirements-release.txt
      - name: Run the repository-native test suite and retain its log
        shell: bash
        env:
          REPOSITORY_NAME: ${{ matrix.name }}
        run: |
          set -o pipefail
          if [ "$REPOSITORY_NAME" = "loomground-epistemic" ]; then
            PYTHONPATH="$GITHUB_WORKSPACE/dependency/src:$GITHUB_WORKSPACE/target/src" \
              python -m pytest -q target/tests 2>&1 | tee "$RUNNER_TEMP/native-test.log"
          else
            PYTHONPATH="$GITHUB_WORKSPACE/target/src" \
              python -m pytest -q target/tests 2>&1 | tee "$RUNNER_TEMP/native-test.log"
          fi
      - name: Bind the successful native test log to the pinned revision
        run: >-
          python control/tools/emit_native_test_result.py
          --name "${{ matrix.name }}"
          --commit "${{ matrix.commit }}"
          --log "$RUNNER_TEMP/native-test.log"
          --output "$RUNNER_TEMP/ecosystem-results"
      - name: Upload native evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecosystem-repository-native-${{ matrix.name }}
          path: ${{ runner.temp }}/ecosystem-results
          if-no-files-found: error
          retention-days: 30

  verify-complete:
    needs: [github-evidence, native-backfill]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Download and merge all repository evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: ecosystem-repository-*
          path: ${{ runner.temp }}/ecosystem-results
          merge-multiple: true
      - name: Require exactly one passing result for all 41 revisions
        run: >-
          python tools/ecosystem_certify.py
          --results "$RUNNER_TEMP/ecosystem-results"
          --self-commit "$GITHUB_SHA"
          --repository-results-only
      - name: Upload the complete 41-repository result set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecosystem-repositories-complete-${{ github.sha }}
          path: ${{ runner.temp }}/ecosystem-results
          if-no-files-found: error
          retention-days: 90

  scenarios:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the certifier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check out the exact non-runtime legal plane
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: flxk1/loomground-legal
          ref: 1ece4536ce2530aa7820bc33e7b2a5787b040a4f
          path: legal
      - name: Download the published Linux runtime and released installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-assets"
          gh release download loomground-runtime-v0.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/runtime-assets" \
            --pattern 'loomground-runtime-0.1.0-linux-x86_64-py312.zip' \
            --pattern 'loomground-runtime-0.1.0-linux-x86_64-py312.sha256' \
            --pattern 'loomground-runtime-0.1.0-linux-x86_64-py312-public.pem' \
            --pattern 'loomground_installer-0.4.0-py3-none-any.whl'
      - name: Verify release provenance and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in "$RUNNER_TEMP/runtime-assets"/*; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow flxk1/loomground-plugins/.github/workflows/runtime-release.yml \
              --source-ref refs/heads/main
          done
          cd "$RUNNER_TEMP/runtime-assets"
          sha256sum -c loomground-runtime-0.1.0-linux-x86_64-py312.sha256
      - name: Install the signed offline runtime transactionally
        shell: bash
        run: |
          unzip -q "$RUNNER_TEMP/runtime-assets/loomground-runtime-0.1.0-linux-x86_64-py312.zip" \
            -d "$RUNNER_TEMP/runtime-bundle"
          python -m venv "$RUNNER_TEMP/installer"
          "$RUNNER_TEMP/installer/bin/pip" install \
            --no-index \
            --find-links "$RUNNER_TEMP/runtime-bundle/wheels" \
            "$RUNNER_TEMP/runtime-assets/loomground_installer-0.4.0-py3-none-any.whl"
          "$RUNNER_TEMP/installer/bin/loomground" runtime install "$RUNNER_TEMP/runtime-bundle" \
            --public-key "$RUNNER_TEMP/runtime-assets/loomground-runtime-0.1.0-linux-x86_64-py312-public.pem" \
            --destination "$RUNNER_TEMP/runtime-installed"
      - name: Install only the controller test toolchain
        run: >-
          python -m pip install
          -r requirements-dev.txt
          -r requirements-release.txt
      - name: Execute all eight ecosystem scenarios through the published MCP runtime
        run: >-
          python tools/run_ecosystem_scenarios.py
          --runtime-lib "$RUNNER_TEMP/runtime-installed/lib"
          --runtime-destination "$RUNNER_TEMP/runtime-installed"
          --legal-src "$GITHUB_WORKSPACE/legal/src"
          --output "$RUNNER_TEMP/scenario-results"
          --scratch "$RUNNER_TEMP/scenario-scratch"
          --self-commit "$GITHUB_SHA"
      - name: Upload scenario results and digest-bound traces
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecosystem-scenarios-${{ github.sha }}
          path: ${{ runner.temp }}/scenario-results
          if-no-files-found: error
          retention-days: 90

  certify:
    needs: [verify-complete, scenarios]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Download the complete repository evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ecosystem-repositories-complete-${{ github.sha }}
          path: ${{ runner.temp }}/ecosystem-results
      - name: Download the complete scenario evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ecosystem-scenarios-${{ github.sha }}
          path: ${{ runner.temp }}/ecosystem-results
      - name: Mint and independently verify the complete certificate
        run: |
          python tools/ecosystem_certify.py \
            --results "$RUNNER_TEMP/ecosystem-results" \
            --self-commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/ecosystem-certification.json"
          python tools/ecosystem_certify.py \
            --verify-certificate "$RUNNER_TEMP/ecosystem-certification.json"
      - name: Upload the complete ecosystem certificate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecosystem-certification-${{ github.sha }}
          path: ${{ runner.temp }}/ecosystem-certification.json
          if-no-files-found: error
          retention-days: 90
