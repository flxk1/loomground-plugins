# Loomground manifest for rvnd-audit.
# Inspects and verifies governance behaviour. Read-only: it reads the policy
# graph, the activation token, the ordered evaluation trace, the effective and
# terminal verdicts, and the delegation/principal chain. It proposes nothing and
# never applies.
name: rvnd-audit
loomground_language: 0.8.0a1
loomground:
  reads:
    - actor
    - human
    - gate
    - master
    - authority
    - pipe
    - egress
    - reservation
    - quorum
    - prohibition
    - egress-obligation
    - redress
    - party
    - delegation
    - autonomy-grade
  proposes: []
  never_applies_directly: true
  read_only: true
rvnd:
  tools:
    - rvnd_query
    - rvnd_verify
confirmation:
  mutations: not-applicable       # read-only skill
