# Loomground manifest for rvnd-govern.
# Declares which real Loomground constructs (loomground-language 0.8.0a1) this
# skill may read and propose. Not authority enforcement - the RVND server still
# enforces authority - but it makes the package reviewable and bounds what the
# skill will ever put in a proposal envelope. Constructs outside this list stay
# residual (see references/grounding.md).
name: rvnd-govern
loomground_language: 0.8.0a1
loomground:
  reads:
    - actor
    - human
    - gate
    - master
    - authority
    - pipe
    - egress
    - reservation
    - quorum
    - prohibition
    - temporal
    - egress-obligation
    - redress
    - party
    - delegation
    - autonomy-grade
  proposes:
    - actor
    - human
    - gate
    - authority
    - pipe
    - egress
    - reservation
    - quorum
    - prohibition
    - temporal
    - egress-obligation
    - redress
    - party
    - delegation
    - autonomy-grade
  never_applies_directly: true   # the skill never writes .lg; RVND generates/validates
rvnd:
  tools:
    - rvnd_query
    - rvnd_propose
    - rvnd_validate
    - rvnd_apply
confirmation:
  mutations: required
